{% extends "base.html" %}

{% block title %}新規登録{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main id="main-content" class="auth-minimal">
    <a class="brand brand-icon-only" href="{{ url_for('login') }}" aria-label="ログイン">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 16.5l5 5L24 10.5"/></svg></span>
    </a>

    <section class="auth-box" aria-labelledby="register-heading">
        <h1 id="register-heading">アカウントを作成</h1>
        <p>自分専用のタスクリストを、すぐに始められます。</p>
        <form class="form-stack" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <div class="label-row"><label for="username">ユーザー名</label><span>3〜50文字</span></div>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
                    <input id="username" name="username" value="{{ request.form.get('username', '') }}" minlength="3" maxlength="50" autocomplete="username" placeholder="ユーザー名を入力" required autofocus>
                </div>
            </div>
            <div class="field">
                <div class="label-row"><label for="password">パスワード</label><span>8〜128文字</span></div>
                <div class="input-with-icon password-field">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    <input id="password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="安全なパスワードを入力" required>
                    <button class="password-toggle" type="button" data-password-toggle aria-label="パスワードを表示">表示</button>
                </div>
                <p class="field-help">英字と数字を組み合わせることをおすすめします。</p>
            </div>
            <button class="button primary wide" type="submit">アカウントを作成</button>
        </form>
        <p class="auth-switch">すでにアカウントをお持ちの方は <a href="{{ url_for('login') }}">ログイン</a></p>
    </section>
    <p class="auth-note">Focus on what matters.</p>
</main>
{% endblock %}
