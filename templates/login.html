{% extends "base.html" %}

{% block title %}ログイン{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main id="main-content" class="auth-minimal">
    <a class="brand brand-icon-only" href="{{ url_for('login') }}" aria-label="ログイン">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 16.5l5 5L24 10.5"/></svg></span>
    </a>

    <section class="auth-box" aria-labelledby="login-heading">
        <h1 id="login-heading">おかえりなさい</h1>
        <p>今日やることを確認して、続きから始めましょう。</p>
        <form class="form-stack" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="username">ユーザー名</label>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></svg>
                    <input id="username" name="username" value="{{ request.form.get('username', '') }}" maxlength="50" autocomplete="username" placeholder="ユーザー名を入力" required autofocus>
                </div>
            </div>
            <div class="field">
                <div class="label-row"><label for="password">パスワード</label><span>8文字以上</span></div>
                <div class="input-with-icon password-field">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    <input id="password" type="password" name="password" maxlength="128" autocomplete="current-password" placeholder="パスワードを入力" required>
                    <button class="password-toggle" type="button" data-password-toggle aria-label="パスワードを表示">表示</button>
                </div>
            </div>
            <button class="button primary wide" type="submit">ログイン</button>
        </form>
        <p class="auth-switch">アカウントをお持ちでない方は <a href="{{ url_for('register') }}">新規登録</a></p>
    </section>
    <p class="auth-note">タスクを、迷わず前へ。</p>
</main>
{% endblock %}
