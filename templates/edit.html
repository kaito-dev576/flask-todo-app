{% extends "base.html" %}

{% block title %}タスクを編集{% endblock %}
{% block body_class %}app-page edit-page{% endblock %}
{% block site_header %}{% include "_app_header.html" %}{% endblock %}

{% block content %}
<main id="main-content" class="edit-shell">
    <a class="back-link" href="{{ url_for('index') }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        ダッシュボードへ戻る
    </a>
    <section class="panel edit-card" aria-labelledby="edit-heading">
        <div class="panel-heading edit-heading">
            <span class="panel-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            </span>
            <div><span class="eyebrow">EDIT TASK</span><h1 id="edit-heading">タスクを編集</h1></div>
        </div>
        <p class="panel-intro">内容を見直して、今の予定に合わせて更新しましょう。</p>

        <form class="form-stack edit-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="task-name">タスク名</label>
                <input id="task-name" name="name" value="{{ task.name }}" maxlength="100" required autofocus>
            </div>
            <div class="field">
                <label for="task-category">カテゴリ</label>
                <select id="task-category" name="category_id" required>
                    {% for category in categories %}
                        <option value="{{ category.id }}" {% if task.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="task-deadline">期限</label>
                <input id="task-deadline" type="date" name="deadline" value="{{ task.deadline }}" required>
            </div>
            <div class="edit-actions">
                <a class="button secondary" href="{{ url_for('index') }}">キャンセル</a>
                <button class="button primary" type="submit">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
                    変更を保存
                </button>
            </div>
        </form>
    </section>
</main>
{% endblock %}
